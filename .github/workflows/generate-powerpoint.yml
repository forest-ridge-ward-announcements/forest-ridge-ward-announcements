name: Generate announcement PowerPoint

on:
  push:
    branches:
      - main
    paths:
      - announcements.json
      - scripts/**
      - powerpoint/**
      - images/**
      - package.json
      - package-lock.json
      - .github/workflows/generate-powerpoint.yml
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Remove expired announcements
        run: npm run prune

      - name: Generate PowerPoint
        run: npm run generate

      - name: Publish updated PowerPoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add announcements.json downloads/announcements.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly announcement PowerPoint"
            git push
          fi