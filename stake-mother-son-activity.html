<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f3a">
  <title>Stake Mother &amp; Son Activity | Forest Ridge Ward</title>
  <link rel="stylesheet" href="styles/styles.css">
  <style>
    body {
      background: #c83f3b;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(255,255,255,0.12) 0,
        rgba(255,255,255,0.12) 2px,
        transparent 2px,
        transparent 7px
      );
    }

    .poster-shell {
      width: min(760px, calc(100% - 32px));
      margin: 28px auto;
      padding: 22px;
      background: #f6f0e7;
      box-shadow: inset 0 0 0 8px rgba(200, 63, 59, 0.9), inset 0 0 0 14px rgba(255,255,255,0.18);
      position: relative;
      border: 2px solid rgba(24,53,50,0.25);
    }

    .poster-shell::before,
    .poster-shell::after {
      content: "";
      position: absolute;
      inset: 10px 10px auto 10px;
      height: 26px;
      background: repeating-linear-gradient(
        90deg,
        rgba(200,63,59,0.15),
        rgba(200,63,59,0.15) 3px,
        transparent 3px,
        transparent 7px
      );
      pointer-events: none;
    }

    .poster-shell::after {
      inset: auto 10px 10px 10px;
      height: 26px;
      top: auto;
    }

    .poster-contents {
      background: rgba(255,255,255,0.15);
      padding: 26px 26px 10px;
      text-align: center;
    }

    .poster-contents svg {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
